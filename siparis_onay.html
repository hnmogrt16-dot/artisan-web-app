<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sipariş Onaylandı - Artisan Studio</title>
  
  <!-- PWA ve Mobil Entegrasyon Etiketleri -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C45B24">

  <!-- Fontlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --bg-main: #F4ECE1;
      --card-bg: #FAF5EE;
      --primary-dark: #3D2B1F;
      --accent-orange: #C45B24;
      --sub-text: #7A6352;
      --border-color: #E8DCCF;
      --success-green: #27AE60;
      --success-bg: #E8F8F0;
    }
 
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
 
    body {
      background-color: #CDBEB1;
      color: var(--primary-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* TELEFON UYGULAMASI ÇERÇEVESİ */
    .phone-wrapper {
      width: 100%;
      max-width: 390px;
      background-color: var(--bg-main);
      border: 10px solid #2C1810;
      border-radius: 35px;
      box-shadow: 0 15px 35px rgba(44, 24, 16, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 820px;
      padding-bottom: 30px;
    }

    /* TELEFON ÜST ÇENTİK / DİNAMİK ADA (NOTCH) */
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 20px;
      background-color: #2C1810;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      z-index: 1005;
      pointer-events: none;
    }

    /* UYGULAMA İÇİ EKRAN */
    .phone-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 45px 16px 20px 16px;
      align-items: center;
      justify-content: center;
    }

    /* ONAY KARTI İÇERİĞİ */
    .confirmation-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 25px rgba(61,43,31,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
 
    .brand-logo-holder {
      display: flex;
      justify-content: center;
      align-items: center;
    }
 
    .chef-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--card-bg);
      box-shadow: 0 6px 18px rgba(61,43,31,0.12);
    }
 
    .success-icon-badge {
      width: 52px;
      height: 52px;
      background-color: var(--success-bg);
      color: var(--success-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      border: 2px solid #A8E6CF;
      box-shadow: 0 4px 12px rgba(39,174,96,0.15);
      margin-top: -8px;
    }
 
    .order-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
 
    .order-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: var(--primary-dark);
      font-weight: 700;
      line-height: 1.1;
    }
 
    .order-subtitle {
      font-size: 0.8rem;
      color: var(--sub-text);
      line-height: 1.4;
      padding: 0 10px;
    }
 
    .order-code-box {
      background-color: var(--bg-main);
      border: 1px dashed var(--border-color);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.82rem;
      color: var(--primary-dark);
      font-weight: 500;
    }
 
    .order-code-box strong {
      color: var(--accent-orange);
      letter-spacing: 0.5px;
    }
 
    .home-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-orange);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(196,91,36,0.25);
    }
 
    .home-btn:hover {
      background-color: #b04e1e;
    }
 
    @media (max-width: 480px) {
      body {
        padding: 0;
        background-color: var(--bg-main);
      }
      .phone-wrapper {
        width: 100%;
        min-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .phone-notch {
        display: none;
      }
    }
  </style>
</head>
<body>
 
  <!-- TELEFON ÇERÇEVESİ -->
  <div class="phone-wrapper">
    <div class="phone-notch"></div>

    <div class="phone-screen">
 
      <div class="confirmation-card">
        
        <!-- BÜYÜTÜLMÜŞ ŞEF LOGOSU -->
        <div class="brand-logo-holder">
          <img src="resimler/sef.jpg.png" alt="Artisan Şefi" class="chef-logo">
        </div>
     
        <!-- YEŞİL TİK ROZETİ -->
        <div class="success-icon-badge">✓</div>
        
        <!-- BAŞLIK VE METİN -->
        <div class="order-title-group">
          <h1 class="order-title">Siparişiniz Alındı!</h1>
          <p class="order-subtitle">Nispeten çıtır lezzetleriniz özenle hazırlanmak üzere şeflerimize ulaştı.</p>
        </div>
     
        <!-- SİPARİŞ KODU -->
        <div class="order-code-box">
          Sipariş Kodu: <strong id="orderCode">#ART-84920</strong>
        </div>
     
        <!-- ANASAYFAYA DÖN BUTONU -->
        <a href="index.html" class="home-btn">Anasayfaya Dön 🏠</a>
     
      </div>

    </div>
  </div>

  <script>
    // Sipariş başarılı tamamlandığı için sepeti sıfırla ve yeni kod oluştur
    window.addEventListener('DOMContentLoaded', () => {
      localStorage.removeItem('artisanCart');
      localStorage.removeItem('artisan_cart');
      
      const randomCode = Math.floor(10000 + Math.random() * 90000);
      const codeElement = document.getElementById('orderCode');
      if(codeElement) {
        codeElement.textContent = `#ART-${randomCode}`;
      }
    });
  </script>
</body>
</html>
