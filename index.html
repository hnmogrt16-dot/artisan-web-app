  <!DOCTYPE html>
  <html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artisan Workshop - Hoş Geldiniz</title>
    
    <!-- PWA ve Mobil Entegrasyon Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C45B24">

    <!-- Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
    <style>
      /* Toprak ve Sıcak Renk Değişkenleri */
      :root {
        --bg-main:#EFE6DC;
        --card-bg:#FFFFFF;
        --sidebar-bg:#E5DACD;
        --primary-dark:#3D2B1F;
        --soft-brown:#5C4033;
        --accent-orange:#C45B24;
        --whatsapp-green:#25D366;
        --sub-text:#7D6858;
        --border-color:#D8C9B8;
      }
  
      * { 
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
      }
  
      body {
        background-color: #CDBEB1;
        color: var(--primary-dark);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        overflow: hidden;
      }
  
      /* TELEFON UYGULAMASI ÇERÇEVESİ */
      .phone-wrapper {
        width: 100%;
        max-width: 390px;
        height: 820px;
        max-height: 95vh;
        background-color: var(--bg-main);
        border: 10px solid #3D2B1F;
        border-radius: 35px;
        box-shadow: 0 15px 35px rgba(61, 43, 31, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      /* TELEFON ÜST ÇENTİK / DİNAMİK ADA (NOTCH) */
      .phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 20px;
        background-color: #3D2B1F;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
        z-index: 1002;
        pointer-events: none;
      }

      /* UYGULAMA İÇİ EKRAN */
      .phone-screen {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        position: relative;
        padding: 45px 14px 16px 14px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .phone-screen::-webkit-scrollbar {
        display: none;
      }

      /* HAMBURGER BUTONU */
      .menu-toggle-btn {
        position: absolute;
        top: 24px;
        left: 14px;
        z-index: 1001;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--primary-dark);
        width: 38px;
        height: 38px;
        border-radius: 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(61, 43, 31, 0.08);
        transition: all 0.2s ease;
      }

      .menu-toggle-btn:hover {
        background-color: var(--sidebar-bg);
        border-color: var(--accent-orange);
      }

      .menu-toggle-btn span {
        display: block;
        width: 16px;
        height: 2px;
        background-color: var(--primary-dark);
        border-radius: 2px;
        pointer-events: none;
      }

      /* BÜYÜTÜLEN ÜST LOGO */
      .header-logo-area {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
        margin-bottom: 12px;
      }

      .header-logo-img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--card-bg);
        box-shadow: 0 6px 16px rgba(61, 43, 31, 0.12);
      }

      /* KARARTMA KATMANI */
      .sidebar-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(61, 43, 31, 0.45);
        backdrop-filter: blur(2px);
        z-index: 9998;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* AÇILIR-KAPANIR SOL MENÜ */
      .sidebar {
        width: 250px;
        height: 100%;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 9999;
        box-shadow: 6px 0 20px rgba(61,43,31,0.15);
        transform: translateX(-100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        overflow-y: auto;
      }
  
      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--border-color);
        color: var(--primary-dark);
        width: 26px;
        height: 26px;
        border-radius: 50%;
        font-size: 0.8rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .sidebar-close-btn:hover {
        background-color: var(--accent-orange);
        color: #FFFFFF;
        border-color: var(--accent-orange);
      }
  
      /* ŞEF GÖRSELİ (SOL MENÜ İÇİ) */
      .sidebar-header-img {
        padding: 18px 12px 10px 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
      }
  
      .chef-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #FFFFFF;
        box-shadow: 0 4px 10px rgba(61,43,31,0.08);
      }
  
      /* Menü Linkleri */
      .nav-list {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
  
      .nav-btn {
        width: 100%;
        padding: 10px 14px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--primary-dark);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }
  
      .nav-btn:hover {
        background-color: rgba(255,255, 255,0.6);
        color: var(--accent-orange);
      }
  
      .nav-btn.active {
        background-color: var(--soft-brown);
        color: #FFFFFF;
        border-bottom-color: var(--soft-brown);
        font-weight: 600;
      }
  
      /* SOSYAL MEDYA İKON ALANI */
      .sidebar-social-section {
        padding: 10px 12px;
        text-align: center;
        border-top: 1px solid var(--border-color);
        background-color: rgba(255,255, 255,0.2);
        flex-shrink: 0;
      }
  
      .sidebar-social-title {
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--sub-text);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
  
      .sidebar-social-icons {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
  
      .sidebar-social-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 0 2px 4px rgba(61,43,31,0.05);
      }
  
      .sidebar-social-btn svg {
        width: 10px;
        height: 10px;
        fill: var(--primary-dark);
        transition: fill 0.2s ease;
      }
  
      .sidebar-social-btn:hover {
        background-color: var(--accent-orange);
        border-color: var(--accent-orange);
        transform: translateY(-2px);
      }
  
      .sidebar-social-btn:hover svg {
        fill: #FFFFFF;
      }
  
      /* ANA İÇERİK ALANI */
      .hero-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
  
      .cards-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
  
      .choice-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(61,43,31,0.05);
      }
  
      .card-image {
        width: 100%;
        height: 90px;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(61,43,31,0.05);
      }
  
      .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
  
      .btn-group-vertical {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 100%;
      }
  
      .card-action-btn-large {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 10px;
        background-color: var(--soft-brown);
        color: #FFFFFF;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.78rem;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(92,64,51,0.1);
      }
  
      .card-action-btn-large:hover {
        background-color: var(--accent-orange);
        transform: translateY(-1px);
      }

      /* YAN YANA VE DAHA KÜÇÜK SİPARİŞ İLETİŞİM BUTONLARI */
      .quick-order-section {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 EŞİT YAN YANA SÜTUN */
        gap: 8px;
        margin-top: 4px;
      }
  
      .order-direct-btn {
        width: 100%;
        padding: 8px 6px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.72rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        white-space: nowrap;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(61,43, 31,0.05);
      }
  
      .order-direct-btn.whatsapp {
        background-color: var(--whatsapp-green);
        color: #FFFFFF;
      }
  
      .order-direct-btn.whatsapp:hover {
        background-color: #1ebc57;
        transform: translateY(-1px);
      }
  
      .order-direct-btn.phone {
        background-color: var(--primary-dark);
        color: #FFFFFF;
        border: 1px solid var(--primary-dark);
      }
  
      .order-direct-btn.phone:hover {
        background-color: var(--accent-orange);
        border-color: var(--accent-orange);
        transform: translateY(-1px);
      }
  
      .order-direct-btn svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
        flex-shrink: 0;
      }
  
      /* TELEFONDAN AÇILDIĞINDA EKRANI TAM KAPLAMASI İÇİN MEDYA SORGUSU */
      @media (max-width: 480px) {
        body {
          padding: 0;
          background-color: var(--bg-main);
        }
        .phone-wrapper {
          width: 100%;
          height: 100vh;
          max-height: 100vh;
          border: none;
          border-radius: 0;
          box-shadow: none;
        }
        .phone-notch {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      function toggleSidebar(){
        sidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      }

      function closeSidebar(){
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      }
