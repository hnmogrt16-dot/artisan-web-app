<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Favorilerim - Artisan Studio</title>
  
  <!-- PWA ve Mobil Entegrasyon Etiketleri -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C45B24">

  <!-- Fontlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --bg-main: #F4ECE1;
      --card-bg: #FAF5EE;
      --primary-dark: #3D2B1F;
      --accent-orange: #C45B24;
      --sub-text: #7A6352;
      --border-color: #E8DCCF;
      --sidebar-bg: #FAF5EE;
    }
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
 
    body {
      background-color: #CDBEB1;
      color: var(--primary-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* TELEFON UYGULAMASI ÇERÇEVESİ */
    .phone-wrapper {
      width: 100%;
      max-width: 390px;
      background-color: var(--bg-main);
      border: 10px solid #2C1810;
      border-radius: 35px;
      box-shadow: 0 15px 35px rgba(44, 24, 16, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 820px;
      padding-bottom: 30px;
    }

    /* TELEFON ÜST ÇENTİK / DİNAMİK ADA (NOTCH) */
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 20px;
      background-color: #2C1810;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      z-index: 1005;
      pointer-events: none;
    }

    /* UYGULAMA İÇİ EKRAN */
    .phone-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 45px 12px 20px 12px;
    }

    /* MENÜ AÇMA / HAMBURGER BUTONU */
    .menu-toggle-btn {
      position: absolute;
      top: 24px;
      left: 12px;
      z-index: 1004;
      background-color: var(--primary-dark);
      color: #FFFFFF;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }
 
    .menu-toggle-btn:hover {
      background-color: var(--accent-orange);
      transform: scale(1.05);
    }
 
    .menu-toggle-btn span.bar {
      display: block;
      width: 16px;
      height: 2px;
      background-color: #FFFFFF;
      border-radius: 2px;
      pointer-events: none;
    }
 
    /* GERİ DÖN BUTONU */
    .fixed-back-btn {
      position: absolute;
      top: 24px;
      left: 55px;
      z-index: 1003;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--primary-dark);
      height: 36px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
 
    .fixed-back-btn:hover {
      background-color: #EFE6DA;
      color: var(--accent-orange);
      border-color: var(--accent-orange);
    }

    /* ÜST LOGO ALANI */
    .header-logo-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
      margin-bottom: 12px;
    }

    .header-logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-bg);
      box-shadow: 0 4px 15px rgba(61,43,31,0.15);
    }
 
    /* KARARTMA PERDESİ (OVERLAY) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(44,24,16,0.45);
      backdrop-filter: blur(2px);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
 
    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }
 
    /* SOL AÇILIR MENÜ (SIDEBAR) */
    .sidebar {
      width: 260px;
      height: 100vh;
      background-color: var(--sidebar-bg);
      border-right: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: -100%;
      z-index: 9999;
      box-shadow: 6px 0 20px rgba(44,24,16,0.15);
      transition: left 0.35s cubic-bezier(0.16,1,0.3,1);
      overflow-y: auto;
    }
 
    .sidebar.open {
      left: 0;
    }
 
    .sidebar-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--border-color);
      color: var(--primary-dark);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
 
    .sidebar-close-btn:hover {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border-color: var(--accent-orange);
    }
 
    .sidebar-header-img {
      padding: 18px 12px 10px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
 
    .chef-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(61,43,31,0.08);
    }
 
    .nav-list {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
 
    .nav-btn {
      width: 100%;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--primary-dark);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    .nav-btn:hover {
      background-color: #EFE6DA;
      color: var(--accent-orange);
      padding-left: 18px;
    }
 
    .nav-btn.active {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border-bottom-color: var(--accent-orange);
      font-weight: 600;
    }
 
    /* SAYFA BAŞLIĞI VE İÇERİK */
    .fav-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding: 0 4px;
    }

    .fav-title-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-btn {
      background: none; 
      border: none; 
      color: var(--sub-text);
      cursor: pointer; 
      font-size: 0.75rem; 
      text-decoration: underline;
      font-weight: 500;
    }

    .clear-btn:hover {
      color: #d9534f;
    }

    .fav-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fav-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(61,43,31,0.04);
    }

    .fav-delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 5px;
    }

    .fav-card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
      padding-right: 22px;
    }

    .fav-card-desc {
      font-size: 0.72rem;
      color: var(--sub-text);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .fav-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      margin-top: auto;
    }

    .fav-card-price {
      font-weight: 700;
      color: var(--accent-orange);
      font-size: 0.85rem;
    }

    .add-cart-btn {
      background: var(--accent-orange);
      color: #FFF;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-cart-btn:hover {
      background-color: #b04e1e;
    }

    .empty-fav-msg {
      text-align: center;
      padding: 40px 15px;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px dashed var(--border-color);
      color: var(--sub-text);
    }

    /* BİLDİRİM KARTI (TOAST) */
    .toast-notification {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 10000;
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(61,43,31,0.18);
      transform: translateY(150%);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .toast-notification.show {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .toast-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toast-icon {
      width: 28px;
      height: 28px;
      background-color: #E8F5E9;
      color: #2E7D32;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .toast-title-group {
      display: flex;
      flex-direction: column;
    }

    .toast-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .toast-subtitle {
      font-size: 0.7rem;
      color: var(--sub-text);
    }

    .toast-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .toast-btn-secondary, .toast-btn-primary {
      flex: 1;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      text-align: center;
    }

    .toast-btn-secondary {
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--primary-dark);
    }

    .toast-btn-primary {
      border: none;
      background-color: var(--accent-orange);
      color: #FFFFFF;
    }

    /* SİLME MODALI */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44, 24, 16, 0.45);
      backdrop-filter: blur(2px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 22px 18px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(61,43,31,0.2);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .modal-btn-cancel {
      background: var(--card-bg);
      color: var(--primary-dark);
      border: 1px solid var(--border-color);
    }

    .modal-btn-confirm {
      background: #d9534f;
      color: #FFFFFF;
    }

    /* TELEFONDAN AÇILDIĞINDA EKRANI TAM KAPLAMASI İÇİN MEDYA SORGUSU */
    @media (max-width: 480px) {
      body {
        padding: 0;
        background-color: var(--bg-main);
      }
      .phone-wrapper {
        width: 100%;
        min-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .phone-notch {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- TELEFON ÇERÇEVESİ -->
  <div class="phone-wrapper">
    <div class="phone-notch"></div>

    <div class="phone-screen">

      <!-- SOL ÜST ÜÇ ÇİZGİ MENÜ BUTONU -->
      <button class="menu-toggle-btn" id="menuBtn" aria-label="Menüyü Aç">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- GERİ DÖN BUTONU -->
      <a href="index.html" class="fixed-back-btn">← Geri</a>

      <!-- ÜST LOGO (SEF.JPG.PNG) -->
      <div class="header-logo-area">
        <img src="resimler/sef.jpg.png" alt="Artisan Logo" class="header-logo-img">
      </div>

      <!-- SOL AÇILIR MENÜ (SIDEBAR) -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <aside class="sidebar" id="sidebarDrawer">
        <button class="sidebar-close-btn" id="sidebarCloseBtn">✕</button>

        <!-- ŞEF GÖRSELİ LOGO ALANI -->
        <div class="sidebar-header-img">
          <img src="resimler/sef.jpg.png" alt="Artisan Şefi" class="chef-avatar">
        </div>

        <nav class="nav-list">
          <a href="index.html" class="nav-btn">🏠 Anasayfa</a>
          <a href="tost1..html" class="nav-btn">🌟 Hazır Tostlar</a>
          <a href="tostolustur.html" class="nav-btn">🥪 Kendi Tostunu Hazırla</a>
          <a href="sandvic.html" class="nav-btn">🍞 Hazır Sandviç</a>
          <a href="sandvicolustur.html" class="nav-btn">🥖 Kendi Sandviçini Hazırla</a>
          <a href="sepetim.html" class="nav-btn">🛒 Sepetim</a>
          <a href="favoriler.html" class="nav-btn active">⭐ Favoriler</a>
          <a href="hakkimiz.html" class="nav-btn">ℹ️ Hakkımızda</a>
          <a href="iletisim.html" class="nav-btn">📞 İletişim</a>
        </nav>
      </aside>

      <!-- ANA İÇERİK -->
      <main class="editor-main">
        <div class="fav-title-bar">
          <div class="fav-title-text">
            <span>⭐</span> Favori Tarifleriniz
          </div>
          <button class="clear-btn" onclick="openConfirmModal()">Tümünü Temizle</button>
        </div>

        <div id="favoritesGrid" class="fav-grid"></div>
      </main>

    </div>

    <!-- BİLDİRİM KARTI / TOAST NOTIFICATION -->
    <div class="toast-notification" id="toastCard">
      <div class="toast-header">
        <div class="toast-icon">✓</div>
        <div class="toast-title-group">
          <span class="toast-title">Sepete Eklendi!</span>
          <span class="toast-subtitle" id="toastItemName">Tarifiniz sepete atıldı.</span>
        </div>
      </div>
      <div class="toast-actions">
        <button class="toast-btn-secondary" onclick="closeToast()">Tamam</button>
        <button class="toast-btn-primary" onclick="window.location.href='sepetim.html'">Sepete Git ➔</button>
      </div>
    </div>

    <!-- ONAY MODALI -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal-box">
        <div style="font-size: 2rem; margin-bottom: 6px;">⚠️</div>
        <div style="font-size: 1rem; font-weight: 700; margin-bottom: 6px;">Emin misiniz?</div>
        <div style="font-size: 0.78rem; color: var(--sub-text);">Favorilerinizdeki tüm kaydedilmiş tarifler silinecektir.</div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">Vazgeç</button>
          <button class="modal-btn modal-btn-confirm" onclick="confirmClearAllFavorites()">Evet, Sil</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const sidebarDrawer = document.getElementById('sidebarDrawer');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const menuBtn = document.getElementById('menuBtn');
    const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
    const toastCard = document.getElementById('toastCard');
    const toastItemName = document.getElementById('toastItemName');
    let toastTimeout = null;

    function toggleSidebar(){
      sidebarDrawer.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    }

    function closeSidebar(){
      sidebarDrawer.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    }

    if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    if (sidebarCloseBtn) sidebarCloseBtn.addEventListener('click', closeSidebar);

    /* TÜM FAVORİ KAYNAKLARINI TEK DİZİDE BİRLEŞTİRME */
    function getAllFavorites(){
      try {
        const sandwiches = JSON.parse(localStorage.getItem('artisanSandwichFavs') || '[]');
        const toasts = JSON.parse(localStorage.getItem('artisanTostFavs') || '[]');
        const oldSandwiches = JSON.parse(localStorage.getItem('artisan_fav_sandwiches') || '[]');
        const oldToasts = JSON.parse(localStorage.getItem('artisan_fav_toasts') || '[]');
        const generalFavs = JSON.parse(localStorage.getItem('artisan_favorites') || '[]');

        return [...sandwiches, ...toasts, ...oldSandwiches, ...oldToasts, ...generalFavs];
      } catch (e) {
        console.error("Favoriler okunurken hata oluştu:", e);
        return [];
      }
    }

    function deleteFavorite(index){
      let sandwiches = JSON.parse(localStorage.getItem('artisanSandwichFavs') || '[]');
      let toasts = JSON.parse(localStorage.getItem('artisanTostFavs') || '[]');
      let oldSandwiches = JSON.parse(localStorage.getItem('artisan_fav_sandwiches') || '[]');
      let oldToasts = JSON.parse(localStorage.getItem('artisan_fav_toasts') || '[]');
      let generalFavs = JSON.parse(localStorage.getItem('artisan_favorites') || '[]');

      let curr = index;

      if (curr < sandwiches.length) {
        sandwiches.splice(curr, 1);
        localStorage.setItem('artisanSandwichFavs', JSON.stringify(sandwiches));
      } else {
        curr -= sandwiches.length;
        if (curr < toasts.length) {
          toasts.splice(curr, 1);
          localStorage.setItem('artisanTostFavs', JSON.stringify(toasts));
        } else {
          curr -= toasts.length;
          if (curr < oldSandwiches.length) {
            oldSandwiches.splice(curr, 1);
            localStorage.setItem('artisan_fav_sandwiches', JSON.stringify(oldSandwiches));
          } else {
            curr -= oldSandwiches.length;
            if (curr < oldToasts.length) {
              oldToasts.splice(curr, 1);
              localStorage.setItem('artisan_fav_toasts', JSON.stringify(oldToasts));
            } else {
              curr -= oldToasts.length;
              if (curr < generalFavs.length) {
                generalFavs.splice(curr, 1);
                localStorage.setItem('artisan_favorites', JSON.stringify(generalFavs));
              }
            }
          }
        }
      }
      renderFavorites();
    }

    function openConfirmModal(){
      const favorites = getAllFavorites();
      if (!favorites || favorites.length === 0) return;
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal(){
      document.getElementById('confirmModal').classList.remove('active');
    }

    function confirmClearAllFavorites(){
      localStorage.removeItem('artisanSandwichFavs');
      localStorage.removeItem('artisanTostFavs');
      localStorage.removeItem('artisan_fav_sandwiches');
      localStorage.removeItem('artisan_fav_toasts');
      localStorage.removeItem('artisan_favorites');
      closeConfirmModal();
      renderFavorites();
    }

    function addToCartFromFav(index){
      const favorites = getAllFavorites();
      const recipe = favorites[index];
      if (!recipe) return;

      let cart = [];
      try {
        cart = JSON.parse(localStorage.getItem('artisanCart') || localStorage.getItem('artisan_cart') || '[]');
      } catch (e) {
        cart = [];
      }

      const itemTitle = recipe.name || recipe.title || 'Özel Tarif';
      const itemDesc = recipe.desc || (Array.isArray(recipe.items) ? recipe.items.join(', ') : 'Özel hazırlanan lezzet tarifi');
      const itemPrice = Number(recipe.price) || 0;
      const itemKcal = Number(recipe.kcal) || 0;

      const existingIndex = cart.findIndex(item => (item.name || item.title) === itemTitle);
      
      if (existingIndex > -1) {
        cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + 1;
      } else {
        cart.push({
          id: Date.now(),
          name: itemTitle,
          price: itemPrice,
          kcal: itemKcal,
          desc: itemDesc,
          quantity: 1,
          type: 'custom'
        });
      }

      localStorage.setItem('artisanCart', JSON.stringify(cart));
      showToast(`"${itemTitle}" sepete atıldı.`);
    }

    function showToast(subtitle){
      toastItemName.textContent = subtitle;
      toastCard.classList.add('show');
      if(toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        closeToast();
      }, 4000);
    }

    function closeToast(){
      toastCard.classList.remove('show');
    }

    function renderFavorites(){
      const favorites = getAllFavorites();
      const favoritesGrid = document.getElementById('favoritesGrid');

      if (!favorites || favorites.length === 0) {
        favoritesGrid.innerHTML = `
          <div class="empty-fav-msg">
            <p style="font-size:0.95rem; font-weight:600; margin-bottom:4px;">Henüz Favoriniz Yok</p>
            <p style="font-size:0.75rem;">Beğendiğiniz veya kendi oluşturduğunuz tarifleri favorilere ekleyerek burada saklayabilirsiniz.</p>
          </div>
        `;
        return;
      }

      favoritesGrid.innerHTML = favorites.map((fav, index) => {
        const title = fav.name || fav.title || 'Özel Tarif';
        const price = Number(fav.price) || 0;
        const details = fav.desc || (Array.isArray(fav.items) && fav.items.length > 0 ? fav.items.join(', ') : 'Özel hazırlanan lezzet tarifi');

        return `
          <div class="fav-card">
            <button class="fav-delete-btn" onclick="deleteFavorite(${index})">✕</button>
            <div>
              <div class="fav-card-title">${title}</div>
              <div class="fav-card-desc">${details}</div>
            </div>
            <div class="fav-card-footer">
              <span class="fav-card-price">₺${price.toFixed(2).replace('.', ',')}</span>
              <button class="add-cart-btn" onclick="addToCartFromFav(${index})">+ Sepete Ekle</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', renderFavorites);
  </script>
</body>
</html>
